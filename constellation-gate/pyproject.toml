[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation-gate"
version = "1.1.0"
description = "Canonical Gate routing authority for the Constellation system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "OpenAI" }
]
dependencies = [
  # constellation-node-sdk is not published to PyPI; it lives in the sibling
  # Quantum-L9/Gate_SDK repository. The compatibility contract is the moving
  # major channel `v1`, owned by Gate_SDK's RELEASE_IDENTITY_LEDGER — not a
  # commit sha. Gate, CEG and EIE all declare this same channel, so "which SDK
  # is the rail on" has one answer instead of one per manifest.
  #
  # A sha pin also has to be *reachable*, which is how this dependency broke
  # before: pip/uv resolve a bare commit by cloning and running
  # `rev-parse <sha>^0`, which only sees refs the remote advertises, and GitHub
  # does not advertise refs/pull/*. The previous pin 69c6c67 was the head of
  # Gate_SDK PR #47 and never landed on a branch under that sha, so every clean
  # install failed with "failed to find branch, tag, or commit"
  # (VERSION_COMPATIBILITY_RECEIPT.yaml and DEPLOYMENT_READINESS_RECEIPT.yaml
  # SDK-MERGE both flagged it). A tag is always advertised, so `@v1` closes that
  # failure mode by construction rather than by re-pinning to a newer sha that
  # can go stale the same way.
  #
  # Reproducibility comes from the generated requirements.lock, which records
  # the concrete object `v1` resolved to plus its archive sha256. That object
  # is execution evidence; it is never the declared dependency.
  # scripts/validate_sdk_pin.py --verify-tag proves the lock is not stale.
  "constellation-node-sdk @ git+https://github.com/Quantum-L9/Gate_SDK.git@v1",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "starlette>=0.37.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  # ruff and mypy are pinned to the exact versions referenced by
  # .pre-commit-config.yaml so direct CI runs (`ruff check`, `mypy src`) and the
  # pre-commit hooks resolve identical tool versions (no lint/type drift).
  "mypy==2.3.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff==0.15.22",
  "types-PyYAML",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "seam_e2e: real-process EIE <-> Gate <-> CEG end-to-end (needs sibling checkouts + Neo4j; skips otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.per-file-ignores]
# Cross-repo E2E drivers embed peer-side scripts and long assertion messages.
"tests/e2e/seam/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["constellation_gate"]
