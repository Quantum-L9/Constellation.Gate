# Static seed topology for the EIE <-> CEG seam (seam audit 2026-09-02).
#
# Loaded at startup when GATE_NODE_REGISTRY_PATH points here
# (NodeRegistry.load_from_yaml). Runtime registration via POST /v1/admin/register
# overwrites these entries. Every entry that claims a canonical action
# (converge -> eie, match/sync/outcomes -> ceg) MUST carry metadata.owner.
#
# Node names MUST equal each node's runtime identity:
#   - Enrichment.Inference.Engine registers as `enrichment-engine`
#   - Cognitive.Engine.Graphs   registers as `graph`
enrichment-engine:
  internal_url: http://enrichment-engine:8000
  supported_actions:
    - converge
    - graph-inference-result
    - enrich
    - enrich-and-sync
  priority_class: P2
  max_concurrent: 50
  health_endpoint: /api/v1/health
  # EIE's complete-operation ceiling (CANONICAL_CONVERGE_BUDGET_SECONDS = 25 s).
  timeout_ms: 25000
  metadata:
    owner: eie
    type: enrichment
    repo_url: https://github.com/Quantum-L9/Enrichment.Inference.Engine

graph:
  internal_url: http://graph:8000
  supported_actions:
    - match
    - sync
    - outcomes
    - resolve
  priority_class: P1
  max_concurrent: 100
  health_endpoint: /v1/health
  timeout_ms: 30000
  metadata:
    owner: ceg
    type: engine
    repo_url: https://github.com/Quantum-L9/Cognitive.Engine.Graphs
