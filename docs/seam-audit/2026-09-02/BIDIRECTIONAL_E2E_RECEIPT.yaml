# Bidirectional real-process E2E receipt — 2026-09-02
harness: Constellation.Gate/constellation-gate/tests/e2e/seam (marker seam_e2e; skips when sibling checkouts/venvs are absent)
run: "pytest tests/e2e/seam -q  ->  18 passed in 21.47s (last run; three earlier runs surfaced SDK-01 and GATE-RETURN-01)"
nothing_mocked: true
processes:
  gate: {cmd: "uvicorn constellation_gate.api.main:app", venv: Constellation.Gate/constellation-gate/.venv, url: "http://127.0.0.1:19000", env: "L9_ENVIRONMENT=local, L9_DEV_MODE=false, L9_REQUIRE_SIGNATURE=true, hmac-sha256, L9_VERIFYING_KEYS_JSON={gate-e2e, eie-e2e, ceg-e2e}, GATE_ADMIN_TOKEN=<random per session>"}
  eie:  {cmd: "uvicorn app.main:app", venv: Enrichment.Inference.Engine/.venv, url: "http://127.0.0.1:19001", registration: "SDK register_node -> POST /v1/admin/register 200", env: "GATE_URL, GATE_INTERNAL_URL, L9_NODE_NAME=enrichment-engine, L9_REQUIRE_SIGNATURE=true, key id eie-e2e, no LLM provider credentials"}
  ceg:  {cmd: "uvicorn chassis.entrypoint:create_app --factory (L9_CHASSIS=sdk)", venv: Cognitive.Engine.Graphs/.venv, url: "http://127.0.0.1:19002", registration: "SDK register_from_env (engine/spec.yaml with internal_url rewritten to the session port) -> 200", env: "L9_NODE_NAME=graph, gate-only ingress, L9_REQUIRE_SIGNATURE=true, key id ceg-e2e, NEO4J_URI=bolt://127.0.0.1:7687"}
  neo4j: {version: "5.26.0 Community, real server in this container", database: "plasticos (initial.dbms.default_database), i.e. CEG's domain id"}
secrets: generated per session, passed only via process environment, absent from the evidence file and logs (verified by grep)
evidence_files: [evidence/seam_evidence.json, evidence/registry_snapshot.json, evidence/gate.log, evidence/eie.log, evidence/ceg.log]
